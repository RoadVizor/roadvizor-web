
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">

    <title>RoadVizor | Vitória</title>

    <link rel="stylesheet" href="../../css/output.css">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="flex flex-row items-start gap-4 lg:gap-8">

    <!-- Sidebar original do RoadVizor -->
    <div id="sidebar_container" class="shrink-0 sticky top-0 h-dvh"></div>

    <main class="flex min-h-dvh min-w-0 flex-1 flex-col gap-7 p-5 lg:p-8">

        <!-- CABEÇALHO -->
        <section>
            <h1 class="text-2xl font-bold">
                Registrar relatório
            </h1>

            <p class="mt-2 text-xs text-white/50">
                Registre as ocorrências identificadas durante o monitoramento dos servidores.
            </p>
        </section>

        <!-- FORMULÁRIO -->
        <section class="rounded-2xl border border-[#30265B] bg-[#0D1730] p-5 md:p-7">

            <form id="form_vitoria" class="grid grid-cols-1 gap-x-5 gap-y-6 md:grid-cols-2">

                <div>
                    <label for="tipo_ocorrencia" class="mb-2 block text-sm font-semibold text-white/80">
                        O que aconteceu?
                    </label>

                    <select
                        id="tipo_ocorrencia"
                        required
                        class="w-full rounded-xl border border-[#30265B] bg-[#080F20] px-4 py-3 text-sm text-white outline-none focus:border-[#00E58B]">

                        <option value="">Selecione uma ocorrência</option>
                        <option value="Indisponibilidade">Indisponibilidade</option>
                        <option value="Desempenho">Desempenho</option>
                        <option value="Falha de componente">Falha de componente</option>
                        <option value="Conectividade">Conectividade</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div>
                    <label for="recurso_afetado" class="mb-2 block text-sm font-semibold text-white/80">
                        Qual recurso foi afetado?
                    </label>

                    <select
                        id="recurso_afetado"
                        required
                        class="w-full rounded-xl border border-[#30265B] bg-[#080F20] px-4 py-3 text-sm text-white outline-none focus:border-[#00E58B]">

                        <option value="">Selecione o recurso</option>
                        <option value="CPU">CPU</option>
                        <option value="RAM">RAM</option>
                        <option value="Disco">Disco</option>
                        <option value="Rede">Rede</option>
                        <option value="Banco de dados">Banco de dados</option>
                        <option value="Serviço">Serviço</option>
                    </select>
                </div>

                <div>
                    <label for="servidor_id" class="mb-2 block text-sm font-semibold text-white/80">
                        Servidor relacionado
                    </label>

                    <select
                        id="servidor_id"
                        required
                        class="w-full rounded-xl border border-[#30265B] bg-[#080F20] px-4 py-3 text-sm text-white outline-none focus:border-[#00E58B]">

                        <option value="">Carregando servidores...</option>
                    </select>
                </div>

                <div>
                    <label for="prioridade" class="mb-2 block text-sm font-semibold text-white/80">
                        Prioridade
                    </label>

                    <select
                        id="prioridade"
                        required
                        class="w-full rounded-xl border border-[#30265B] bg-[#080F20] px-4 py-3 text-sm text-white outline-none focus:border-[#00E58B]">

                        <option value="">Selecione a prioridade</option>
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                        <option value="critica">Crítica</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label for="descricao" class="mb-2 block text-sm font-semibold text-white/80">
                        Descrição complementar
                    </label>

                    <textarea
                        id="descricao"
                        rows="4"
                        maxlength="2000"
                        required
                        placeholder="Descreva brevemente o ocorrido..."
                        class="w-full resize-y rounded-xl border border-[#30265B] bg-[#080F20] px-4 py-3 text-sm text-white outline-none placeholder:text-white/30 focus:border-[#00E58B]"></textarea>
                </div>

                <div class="md:col-span-2">
                    <button
                        type="submit"
                        class="rounded-full border border-[#00E58B]/50 bg-[#00E58B]/10 px-8 py-3 text-sm font-bold text-[#00E58B] transition hover:bg-[#00E58B]/20 disabled:cursor-not-allowed disabled:opacity-50">

                        <i class="ph ph-paper-plane-tilt mr-1"></i>
                        Enviar relatório
                    </button>

                    <p id="mensagem_vitoria" class="mt-3 text-sm"></p>
                </div>

            </form>

        </section>

        <!-- OCORRÊNCIAS REGISTRADAS -->
        <section class="rounded-2xl border border-[#30265B] bg-[#0D1730] p-5 md:p-7">

            <div class="mb-5">
                <h2 class="text-sm font-bold">
                    Ocorrências registradas
                </h2>

                <p class="mt-1 text-[10px] text-white/40">
                    Histórico de ocorrências cadastradas pela empresa.
                </p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full min-w-[900px] text-left">

                    <thead>
                        <tr class="border-b border-white/10">
                            <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-wide text-white/50">Servidor</th>
                            <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-wide text-white/50">Tipo</th>
                            <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-wide text-white/50">Recurso</th>
                            <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-wide text-white/50">Prioridade</th>
                            <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-wide text-white/50">Status</th>
                            <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-wide text-white/50">Data</th>
                            <th class="px-4 py-3 text-[10px] font-semibold uppercase tracking-wide text-white/50">Descrição</th>
                        </tr>
                    </thead>

                    <tbody id="lista_ocorrencias">
                        <tr>
                            <td colspan="7" class="px-4 py-8 text-center text-sm text-white/40">
                                Carregando ocorrências...
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <!-- SCRIPTS ORIGINAIS -->
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/toast.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/components/nivel_acesso.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/vitoria.js"></script>

</body>
</html>
