<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="favicon.svg" type="image/x-icon" />
  <title>RoadVizor | Mapa</title>

  <link href="/css/output.css" rel="stylesheet" />
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!--Link da api-->
  <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
</head>

<body class="flex flex-row items-start gap-4 lg:gap-8">
  <!-- Sidebar -->
  <div id="sidebar_container" class="shrink-0 sticky top-0 h-dvh"></div>

  <!-- Dashboard -->
  <main class="flex-1 min-w-0 min-h-dvh flex flex-col items-start justify-start text-foreground gap-6 lg:gap-8 py-4 pr-4 lg:py-6 lg:pr-6">

    <!-- Servidor mais próximo -->
    <div class="w-full bg-surface border-2 border-accent rounded-xl p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-5">
      <div class="flex items-center gap-4">
        <span class="size-16 shrink-0 rounded-xl bg-accent/10 text-accent flex items-center justify-center">
          <i class="ph ph-hard-drives text-3xl"></i>
        </span>
        <div class="min-w-0">
          <p class="text-sm text-muted">Servidor mais próximo</p>
          <h2 id="proximoNome" class="text-2xl sm:text-3xl font-bold">—</h2>
          <p class="text-sm text-muted flex items-center gap-1">
            <i class="ph ph-map-pin"></i><span id="proximoLocal">—</span>
          </p>
          <p class="text-sm text-muted flex items-center gap-1">
            <i class="ph ph-network"></i><span id="proximoIp">—</span>
          </p>
        </div>
      </div>

      <div class="flex items-center justify-between sm:justify-end gap-6">
        <div>
          <p class="text-sm text-muted">Distância do técnico</p>
          <p id="proximoDistancia" class="text-2xl sm:text-3xl font-bold">—</p>
        </div>
        <button type="button"
          class="h-10 px-4 flex items-center gap-1 rounded-full border-2 border-accent text-accent text-sm font-bold transition-all hover:gap-2 hover:bg-accent/10 cursor-pointer">
          Ver detalhes
          <i class="ph ph-arrow-right"></i>
        </button>
      </div>
    </div>

    <!-- Servidores e Clima -->
    <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3 lg:gap-4">

      <!-- Alertas ativos -->
      <div class="min-h-40 bg-surface border border-disabled/20 hover:border-[var(--warning-text)]/40 duration-150 rounded-xl p-5 sm:p-6 flex flex-col justify-between gap-3">
        <p class="flex items-center gap-2 text-sm text-muted">
          <i class="ph ph-bell text-[var(--warning-text)]"></i>Alertas ativos
        </p>
        <div class="flex items-end justify-between gap-4">
          <p id="qtdAlertas" class="text-5xl font-bold">—</p>
          <div class="flex flex-col gap-1 text-sm text-muted">
            <span class="flex items-center gap-2">
              <span class="size-3 rounded-full bg-[var(--destructive-text)]"></span>
              <b id="qtdCriticos" class="text-foreground">—</b> críticos
            </span>
            <span class="flex items-center gap-2">
              <span class="size-3 rounded-full bg-[var(--warning-text)]"></span>
              <b id="qtdAtencao" class="text-foreground">—</b> em atenção
            </span>
          </div>
        </div>
      </div>

            <!-- Clima -->
      <div class="min-h-40 bg-surface border border-disabled/20 hover:border-accent/40 duration-150 rounded-xl p-5 sm:p-6 flex flex-col justify-between gap-3">
        <p class="flex items-center gap-2 text-sm text-muted">
          <i class="ph ph-cloud-sun text-[var(--warning-text)]"></i>Clima hoje
        </p>
        <div class="flex items-center gap-4">
          <i class="ph ph-cloud-sun text-5xl text-[var(--warning-text)]"></i>
          <div>
            <p id="climaTemp" class="text-4xl font-bold">—</p>
            <p id="climaTipo" class="text-sm text-muted">—</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Mapa -->
    <div class="w-full bg-surface border border-disabled/20 rounded-xl overflow-hidden">
      <div class="px-5 py-4 border-b border-disabled/20 flex flex-wrap items-center justify-between gap-3">
        <h2 class="font-bold text-base sm:text-lg flex items-center gap-2">
          <i class="ph ph-map-trifold text-xl"></i>Mapa de servidores
        </h2>

        <div class="flex flex-wrap items-center gap-4 text-sm text-muted">
          <span class="flex items-center gap-2"><span class="size-3 rounded-full bg-secondary"></span>Técnico</span>
          <span class="flex items-center gap-2"><span class="size-3 rounded-full bg-[var(--warning-text)]"></span>Servidores</span>
          <span class="flex items-center gap-2"><span class="size-3 rounded-full bg-[var(--destructive-text)]"></span>Servidor crítico</span>
        </div>
      </div>

     <div
        id="mapa"
        class="w-full h-96 lg:h-125"
      >
      </div>
    </div>

  </main>

  <script src="../../js/utils/storage.js"></script>
  <script src="../../js/utils/toast.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/nivel_acesso.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../../js/mapa.js"></script>
  <script src="../../js/dashboard.js"></script>
  

  <script>
    document.addEventListener("DOMContentLoaded", (e) => {
      autenticarPagina(1)
      if (sessionStorage.showmsg == 2) {
        toast({
          title: "Usuário já autenticado!",
          variant: "success",
        });
        storage.remove("showmsg")
      }
    });
  </script>
</body>

</html>
