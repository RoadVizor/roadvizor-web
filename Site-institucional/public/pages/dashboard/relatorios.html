<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon" />
    <title>RoadVizor | Relatórios</title>

    <!-- CSS Styles -->
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/report.css">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

  </head>
  <body class="flex flex-row items-start gap-4 lg:gap-8">
    <!-- Sidebar -->
    <div id="sidebar_container" class="shrink-0 sticky top-0 h-dvh"></div>

    <!-- Dashboard -->
    <main class="flex-1 min-w-0 min-h-dvh flex flex-col items-start justify-start text-foreground gap-6 lg:gap-8 py-4 pl-4 pr-4 lg:py-6 lg:pl-6 lg:pr-6">

      <!-- Barra de filtros -->
      <div class="src-bar">
        <div class="src-search">
          <i class="ph ph-magnifying-glass"></i>
          <input type="text" placeholder="Pesquisar por nome do servidor..." />
        </div>

        <span class="src-divider"></span>

        <div class="src-filters">
          <div class="src-select">
            <i class="ph ph-cpu"></i>
            <select id="filtro-componente">
              <option value="">Todos os componentes</option>
              <option value="cpu">CPU</option>
              <option value="ram">RAM</option>
              <option value="disco">Disco</option>
              <option value="rede">Rede</option>
            </select>
          </div>

          <div class="src-select">
            <span class="src-dot"></span>
            <select id="filtro-status">
              <option value="">Todos os status</option>
              <option value="normal">Normal</option>
              <option value="atencao">Atenção</option>
              <option value="critico">Crítico</option>
              <option value="inativo">Inativo</option>
            </select>
          </div>


          <button type="button" class="src-reset" title="Limpar filtros" onclick="limparFiltros()">
            <i class="ph ph-arrow-counter-clockwise"></i>
          </button>
        </div>
      </div>

      <!-- Painel de relatórios -->
      <div class="rel-panel">
        <h2 class="rel-title">Relatórios de <span>SPTech Free Flow</span></h2>

        <div class="rel-kpis">
          <!-- Logs hoje -->
          <div class="rel-card rel-logs">
            <div class="rel-card-head">
              <strong>Logs registrados hoje</strong>
              <small>--/--/----</small>
            </div>
            <span class="rel-big">0</span>
          </div>

          <!-- Status dos servidores -->
          <div class="rel-card rel-status">
            <strong>Status dos servidores</strong>
            <div class="rel-status-body">
              <div class="rel-donut">
                <canvas id="chart-status"></canvas>
                <span id="status-total"></span>
              </div>

              <ul class="rel-legend">
                <li><i class="dot normal"></i>Normal<b id="leg-normal">0</b></li>
                <li><i class="dot atencao"></i>Atenção<b id="leg-atencao">0</b></li>
                <li><i class="dot critico"></i>Crítico<b id="leg-critico">0</b></li>
                <li><i class="dot inativo"></i>Inativo<b id="leg-inativo">0</b></li>
              </ul>
            </div>
          </div>

          <!-- Maior uso -->
          <div class="rel-card rel-uso">
            <strong>Maior uso agora</strong>
            <div class="rel-uso-top">
              <span class="rel-percent">--</span>
              <div><b>--</b><small>--</small></div>
            </div>
            <div class="rel-bar"><div class="rel-bar-fill" style="width: 0%"></div><span class="rel-bar-limit" style="left: 80%"></span></div>
            <small></small>
          </div>

          <!-- Logs por componente -->
          <div class="rel-card rel-comp">
            <strong>Logs por componente</strong>
            <ul></ul>
          </div>
        </div>

        <!-- Cards de servidores (preenchidos pelo fetch) -->
        <div class="rel-carousel">
          <div class="rel-track" id="rel-track"></div>
        </div>
      </div>

      <!-- Relatório detalhado (fora do .rel-panel) -->
      <section class="rel-detalhe" id="rel-detalhe" hidden>
        <div class="rel-texto">
          <h2 class="rel-title"><i class="ph ph-books"></i> RELATÓRIO - <span id="det-servidor"></span></h2>
          <div id="det-texto"></div>
          <div class="rel-logs-lista">
            <h3>Logs recentes</h3>
            <ul id="det-logs"></ul>
          </div>
          <button  onclick="exportarPdf()" class="srv-btn primary rel-pdf"><span>Exportar PDF</span> <i class="ph ph-file-pdf"></i></button>
        </div>

        <div class="rel-grafico">
          <div class="rel-grafico-head">
            <h3 id="det-grafico-titulo"></h3>
            <span class="rel-chip"><i class="dot normal"></i> Uso atual</span>
          </div>
          <div class="rel-grafico-canvas">
            <canvas id="chart-detalhe"></canvas>
          </div>
        </div>
      </section>

    </main>

    <!-- Scripts -->
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/toast.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="/libs/chart.js/chart.umd.js"></script>
    <script src="../../js/components/listaServidores.js"></script>
    <script src="../../js/components/nivel_acesso.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/relatorios.js"></script>
  </body>
</html>
