<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon" />
    <title>RoadVizor | Equipe</title>

    <!-- CSS Styles -->
    <link rel="stylesheet" href="../../css/output.css" />

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

  </head>
  <body class="flex flex-row space-x-4 lg:space-x-8">
    <!-- Sidebar -->
     <div id="sidebar_container"></div> 


    <!-- Dashboard -->
    <div
      class="bg-green-500/20 w-full min-h-dvh flex flex-col items-center justify-center"
    >
      <h1 class="text-4xl font-bold"><span id="nome_empresa_equipe"></span> | Equipe</h1>
      <form
        id="register-form"
        onsubmit="cadastrar(event)"
        oninput="checkFormFields(this)"
        class="max-w-4xl w-full flex flex-col gap-4"
      >
        <div class="flex flex-col gap-1">
          <label for="nome" class="text-sm text-muted">Nome completo</label>
          <input
            id="ipt-nome"
            name="nome"
            type="text"
            oninput="validateName(this)"
            class="field-input"
          />
          <p
            id="ipt-nome-auth-message"
            class="hidden text-destructive-foreground text-xs mt-1"
          ></p>
        </div>

        <div class="flex flex-col gap-1">
          <label for="email" class="text-sm text-muted"
            >E-mail corporativo</label
          >
          <input
            id="ipt-email"
            name="email"
            type="email"
            placeholder="email@corporativo.com"
            oninput="validateEmail(this)"
            class="field-input"
          />
          <p
            id="ipt-email-auth-message"
            class="hidden text-destructive-foreground text-xs mt-1"
          ></p>
        </div>

        <div class="flex flex-col gap-1">
          <label for="senha" class="text-sm text-muted">Senha</label>
          <div class="relative">
            <input
              id="ipt-senha"
              name="senha"
              type="password"
              placeholder="* * * * * * * *"
              oninput="validatePassword(this)"
              class="field-input"
            />
            <i
              id="ipt-senha-icon"
              class="ph ph-eye absolute top-1/2 right-4 -translate-y-1/2 cursor-pointer text-disabled hover:text-accent transition-colors"
              onclick="togglePasswordVisibility('ipt-senha')"
            ></i>
          </div>
          <p
            id="ipt-senha-auth-message"
            class="hidden text-destructive-foreground text-xs mt-1"
          ></p>
        </div>

        <div class="flex flex-col gap-1">
          <label for="senha" class="text-sm text-muted"
            >Confirmar a Senha</label
          >
          <input
            id="ipt-senha-confirmar"
            name="senha"
            type="password"
            placeholder="* * * * * * * *"
            oninput="validatePassword(this, true)"
            class="field-input"
          />
          <p
            id="ipt-senha-confirmar-auth-message"
            class="hidden text-destructive-foreground text-xs mt-1"
          ></p>
        </div>

        <button
          id="register-submit"
          type="submit"
          class="w-full h-12 flex items-center justify-center gap-1 not-disabled:hover:gap-2 bg-disabled rounded-md text-background font-bold transition-all not-disabled:hover:bg-accent/90 not-disabled:cursor-pointer"
          disabled
        >
          <span>Cadastrar Membro</span>
          <i class="ph ph-plus transition-all"></i>
        </button>
      </form>
    </div>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/toast.js"></script>
    <script src="../../js/utils/password-toggler.js"></script>
    <script src="../../js/validations.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const resultado = fetch("/api/empresas/").then(res => res.json())
        .then((data) => {
          const elemento = document.getElementById("nome_empresa_equipe")
          console.log(data.empresa.nome_fantasia)
          elemento.innerHTML = data.empresa.nome_fantasia

        })
      })




      function checkFormFields(form) {
        const submitBtn = document.getElementById("register-submit");
        const fields = form.querySelectorAll(".field-input");
        const hasErrors = Array.from(fields).some(
          (field) => field.dataset.hasErrors != "false",
        );

        submitBtn.disabled = hasErrors;
        if (hasErrors) {
          submitBtn.classList.replace("bg-accent", "bg-disabled");
        } else {
          submitBtn.classList.replace("bg-disabled", "bg-accent");
        }
      }


    </script>

  </body>
</html>
